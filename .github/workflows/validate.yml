name: Validate feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate package layout and LuCI files
        run: |
          bash scripts/check-feed.sh
          bash scripts/test-assemble-apk-feed.sh
          bash scripts/test-notify-structure.sh
          bash scripts/test-feed-bootstrap.sh
