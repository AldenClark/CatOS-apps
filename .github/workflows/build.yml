name: Build packages

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt SDK branch
        required: true
        type: choice
        options:
          - 'openwrt-25.12'
          - 'SNAPSHOT'
          - 'openwrt-24.10'
      architecture:
        description: OpenWrt package architecture
        required: true
        type: choice
        options:
          - aarch64_cortex-a53
          - x86_64
          - aarch64_generic
          - mips_24kc

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare SDK output directory
        run: mkdir -p artifacts

      - name: Build all CatOS packages with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ inputs.architecture }}-${{ inputs.openwrt_version }}
          FEEDNAME: catos
          PACKAGES: catos-notify catos-ddns catos-acme luci-app-catos-notify luci-i18n-catos-notify-zh-cn luci-app-catos-ddns luci-app-catos-acme
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

      - name: Upload compiled packages
        uses: actions/upload-artifact@v7
        with:
          name: catos-packages-${{ inputs.architecture }}-${{ inputs.openwrt_version }}
          path: |
            artifacts/bin/packages/**/*.ipk
            artifacts/bin/packages/**/*.apk
          if-no-files-found: error
