name: Publish signed APK feed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catos-apk-feed
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.channel }} (architecture-independent APKs)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: openwrt-25.12
            sdk: aarch64_cortex-a53-openwrt-25.12
          - channel: SNAPSHOT
            sdk: aarch64_cortex-a53-SNAPSHOT
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare SDK output directory
        run: mkdir -p artifacts

      - name: Require the persistent signing key
        env:
          CATOS_APK_PRIVATE_KEY: ${{ secrets.CATOS_APK_PRIVATE_KEY }}
        run: |
          if [[ -z "$CATOS_APK_PRIVATE_KEY" ]]; then
            echo 'CATOS_APK_PRIVATE_KEY is missing. Configure the Actions secret before publishing.' >&2
            exit 1
          fi
          printf '%s\n' "$CATOS_APK_PRIVATE_KEY" | openssl pkey -pubout -out "$RUNNER_TEMP/catos-apk.pem"
          if ! openssl pkey -pubin -in "$RUNNER_TEMP/catos-apk.pem" -text -noout | grep -q 'prime256v1'; then
            echo 'The APK signing key must use the P-256 (prime256v1) curve.' >&2
            exit 1
          fi

      - name: Build and sign CatOS feed with OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: catos
          PACKAGES: catos-notify catos-ddns catos-acme luci-app-catos-notify luci-i18n-catos-notify-zh-cn luci-app-catos-ddns luci-app-catos-acme
          INDEX: '1'
          PRIVATE_KEY: ${{ secrets.CATOS_APK_PRIVATE_KEY }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

      - name: Collect signed package index and CatOS APKs
        run: |
          bash scripts/assemble-apk-feed.sh \
            artifacts/bin/packages \
            site-dist \
            '${{ matrix.channel }}'

      - name: Upload channel feed
        uses: actions/upload-artifact@v7
        with:
          name: catos-apk-${{ matrix.channel }}
          path: site-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Deploy signed feed to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download both OpenWrt channel feeds
        uses: actions/download-artifact@v8
        with:
          pattern: catos-apk-*
          path: site-dist/
          merge-multiple: true

      - name: Verify assembled feeds and publish the public key
        env:
          CATOS_APK_PRIVATE_KEY: ${{ secrets.CATOS_APK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for channel in openwrt-25.12 SNAPSHOT; do
            feed_dir="site-dist/feeds/$channel/all"
            test -s "$feed_dir/packages.adb"
            (cd "$feed_dir" && sha256sum --check SHA256SUMS)
          done

          # Architecture independence is valid only within the SDK's OpenWrt
          # branch. Native packages require additional architecture feeds.
          for app in notify ddns acme; do
            grep -Eq '^[[:space:]]*PKGARCH:=all$' "net/catos-$app/Makefile"
            grep -Eq '^[[:space:]]*LUCI_PKGARCH:=all$' "luci/luci-app-catos-$app/Makefile"
          done

          mkdir -p site-dist/keys
          printf '%s\n' "$CATOS_APK_PRIVATE_KEY" | openssl pkey -pubout -out site-dist/keys/catos-apk.pem
          if ! openssl pkey -pubin -in site-dist/keys/catos-apk.pem -text -noout | grep -q 'prime256v1'; then
            echo 'Invalid APK signing key curve.' >&2
            exit 1
          fi
          cp site/index.html site-dist/index.html
          cp feed.sh site-dist/feed.sh

          echo 'Published public-key fingerprint (DER SHA-256):'
          openssl pkey -pubin -in site-dist/keys/catos-apk.pem -outform DER | sha256sum

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages content
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist/

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
